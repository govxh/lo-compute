name: LO Worker

on:
  workflow_dispatch:
    inputs:
      worker_id:
        description: "Worker id e.g. w1"
        required: true
        default: "w1"
      channel_id:
        description: "Discord channel id for this worker"
        required: true
      role:
        description: "render | code | research | design | general"
        required: false
        default: "general"
      software:
        description: "comma list e.g. blender,ffmpeg,python"
        required: false
        default: ""
      max_minutes:
        description: "Max minutes to run (default 300)"
        required: false
        default: "300"
      operator_actions:
        description: "Optional Semantic Operator Protocol v1 batch JSON (validated by the app before dispatch; coordinate-free)"
        required: false
        default: ""

concurrency:
  group: lo-worker-${{ github.event.inputs.worker_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  worker:
    runs-on: windows-latest
    timeout-minutes: 320

    steps:
      - uses: actions/checkout@v4

      - name: Install requested software
        shell: pwsh
        env:
          LO_SOFTWARE: ${{ github.event.inputs.software }}
        run: |
          $raw = $env:LO_SOFTWARE
          if ([string]::IsNullOrWhiteSpace($raw)) { Write-Host "no software requested"; exit 0 }
          $aliases = @{
            "blender"    = "BlenderFoundation.Blender"
            "ffmpeg"     = "Gyan.FFmpeg"
            "python"     = "Python.Python.3.12"
            "nodejs"     = "OpenJS.NodeJS.LTS"
            "node"       = "OpenJS.NodeJS.LTS"
            "git"        = "Git.Git"
            "vscode"     = "Microsoft.VisualStudioCode"
            "7zip"       = "7zip.7zip"
            "vlc"        = "VideoLAN.VLC"
            "obs"        = "OBSProject.OBSStudio"
            "notepad++"  = "Notepad++.Notepad++"
            "curl"       = "curl.curl"
          }
          $items = $raw -split "," | ForEach-Object { $_.Trim() } | Where-Object { $_ -ne "" }
          foreach ($name in $items) {
            $key = $name.ToLower()
            $id = if ($aliases.ContainsKey($key)) { $aliases[$key] } else { $name }
            Write-Host "Installing: $name ($id)"
            & winget install -e --id $id --accept-source-agreements --accept-package-agreements --silent
            if ($LASTEXITCODE -eq 0) { Write-Host "installed: $name" }
            else { Write-Host "FAILED ($LASTEXITCODE): $name - continuing" }
          }
          Write-Host "software step complete"

      - name: Install worker deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow pyautogui psutil

      - name: Run LO worker (command loop)
        shell: pwsh
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          LO_CHANNEL_ID: ${{ github.event.inputs.channel_id }}
          LO_WORKER_ID: ${{ github.event.inputs.worker_id }}
          LO_ROLE: ${{ github.event.inputs.role }}
          LO_RUN_ID: ${{ github.run_id }}
          LO_MAX_MINUTES: ${{ github.event.inputs.max_minutes }}
          LO_OPERATOR_ACTIONS: ${{ github.event.inputs.operator_actions }}
          STORAGE_TOKEN: ${{ secrets.STORAGE_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python worker/lo_worker.py
